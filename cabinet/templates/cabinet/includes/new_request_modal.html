<div class="modal fade" id="newRequestModal" tabindex="-1" aria-labelledby="newRequestModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="{% url 'cabinet-my-certificates' %}">
        {% csrf_token %}
        {% if from_profile %}<input type="hidden" name="source" value="profile">{% endif %}
        <div class="modal-header">
          <h5 class="modal-title" id="newRequestModalLabel">Новая заявка</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="id_certificate_type" class="form-label">Тип справки</label>
            <select name="certificate_type" id="id_certificate_type" class="form-select" required>
              <option value="income" {% if initial_type == "income" %}selected{% endif %}>О доходах</option>
              <option value="employment" {% if initial_type == "employment" %}selected{% endif %}>С места работы</option>
              <option value="vacation" {% if initial_type == "vacation" %}selected{% endif %}>Об использованных отпусках</option>
              <option value="other" {% if initial_type == "other" %}selected{% endif %}>Прочее</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="id_description" class="form-label">
              Комментарий <span class="text-muted fw-normal">(необязательно, кроме типа «Прочее»)</span>
            </label>
            <textarea name="description" id="id_description" rows="3" class="form-control">{{ initial_description }}</textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-primary">Создать заявку</button>
        </div>
      </form>
    </div>
  </div>
</div>
