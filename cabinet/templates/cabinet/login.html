<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
</head>
<body>
  <h1>Вход в систему</h1>
  <form method="post">
    {% csrf_token %}
    <label>
      Логин:
      <input type="text" name="username" required>
    </label>
    <br>
    <label>
      Пароль:
      <input type="password" name="password" required>
    </label>
    <br>
    <button type="submit">Войти</button>
  </form>
</body>
</html>
