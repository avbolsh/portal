{% extends "cabinet/base.html" %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
  <h1>Вход в систему</h1>
  <form method="post">
    {% csrf_token %}
    <label>
      Логин:
      <input type="text" name="username" required>
    </label>
    <br>
    <label>
      Пароль:
      <input type="password" name="password" required>
    </label>
    <br>
    <button type="submit">Войти</button>
  </form>
{% endblock %}
